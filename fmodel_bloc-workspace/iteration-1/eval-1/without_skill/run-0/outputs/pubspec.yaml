name: transfer_money_bloc_example
description: >
  Standalone example: a bloc (not cubit) that serializes fmodel-dart
  TransferMoneyCommand handling with bloc_concurrency's sequential()
  transformer.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.0
  # Path dependency used only to `dart analyze` this example against the
  # local fmodel-dart checkout during development. In your app, point this
  # at wherever your project already depends on fmodel-dart (hosted, git,
  # or its own path dependency) instead.
  fmodel:
    path: ../../../../../../../fmodel-dart

dev_dependencies:
  lints: ^6.0.0
