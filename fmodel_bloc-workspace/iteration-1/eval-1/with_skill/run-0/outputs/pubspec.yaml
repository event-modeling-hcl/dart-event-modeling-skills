name: transfer_money_screen
description: >
  Presentation layer for a "Transfer Money" banking screen, built with bloc
  on top of an fmodel-dart Decider<TransferMoneyCommand, AccountState,
  LedgerEvent> wired into an EventSourcingAggregate. Demonstrates the
  fmodel_bloc naming discipline (UiEvent/UiState carry the `Ui` marker;
  domain types keep their fmodel names) and serialized command handling via
  bloc_concurrency's sequential() transformer.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  fmodel: ^0.1.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true
